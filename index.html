</button>`).join('')}</div>`:''}</section>`};function renderService(){if(subpage==='bestellungen')return `<h2>Bestellunge</h2>${store.orders.length?store.orders.map(o=>orderCard(o)).join(''):'<div class="panel">Nach keng Testbestellungen.</div>'}`;if(subpage==='rechnung'){let groups=[...new Set(store.orders.map(o=>o.table))];return `<h2>Dëschrechnung</h2>${groups.length?groups.map(t=>{let os=store.orders.filter(o=>o.table===t);return `<div class="panel"><h3>Dësch ${t}</h3>${os.flatMap(o=>o.items).map(i=>`<div class="orderline"><span>${i.qty} × ${esc(i.name)}${i.sauce?' – '+esc(i.sauce):''}</span><span>${euro(i.qty*i.price)}</span></div>`).join('')}<div class="row between" style="margin-top:12px"><b>Total</b><b>${euro(os.reduce((a,o)=>a+total(o.items),0))}</b></div><p class="muted">Demo-Iwwersiicht, keng Bezuelungsfunktioun.</p></div>`}).join(''):'<div class="panel">Nach keng Rechnungen.</div>'}`};let items=currentItems();return `${toast?`<div class="notice">${esc(toast)}</div>`:''}<section class="panel"><h2>🪑 Bestellung ophuelen</h2><div class="fields"><div class="field"><label>Dëschnummer *</label><div class="step"><button onclick="tableNo=Math.max(1,tableNo-1);render()">−</button><strong>${tableNo}</strong><button onclick="tableNo++;render()">+</button></div></div><div class="field"><label>Service</label><select onchange="server=this.value">${store.names.map(n=>`<option ${n===server?'selected':''}>${esc(n)}</option>`).join('')}</select></div></div></section><section class="panel"><h2>🍴 Iessen</h2><h3>🍝 Spaghettien</h3>${['normal','kanner'].map(k=>`<div class="food"><div class="foodgrid"><div><b>${k==='normal'?'Normal Portioun':'🧒 Kannerportioun'}</b><div>${euro(store.prices[k])}</div></div><div class="sauces">${['Bolognese','Pesto','Arabiata','Panna'].map(s=>`<button class="${sauce[k]===s?'chosen':''}" onclick="chooseSauce('${k}','${s}')">${s}</button>`).join('')}</div>${step(k)}</div></div>`).join('')}<h3>🥖 Aneres Iessen</h3><div class="drink"><b>Baguette</b><span>${euro(store.prices.Baguette)}</span>${step('Baguette')}</div></section><section class="panel"><h2>🍺 Gedrénks</h2>${drinks.map(d=>`<div class="drink"><b>${esc(d)}</b><span class="money">${euro(store.prices[d])}</span>${step(d)}</div>`).join('')}</section><section class="panel"><h2>🧾 Aktuell Bestellung</h2>${items.length?items.map(i=>`<div class="orderline"><span>${i.qty} × ${esc(i.name)}${i.sauce?' – '+esc(i.sauce):''}</span><span>${euro(i.qty*i.price)}</span></div>`).join(''):'<p class="muted">Nach keng Artikelen ausgewielt.</p>'}<div class="row between" style="margin:18px 0"><b class="total">Total</b><b class="total">${euro(total(items))}</b></div><div class="row"><button class="danger" onclick="quant={};render()">🗑 Läschen</button><button class="primary" onclick="sendOrder()">✓ Testbestellung schécken</button></div></section>`};function renderAdmin(){return `<section class="panel"><h2>⚙️ Admin – Demo</h2><p class="muted">Nëmmen d'Demo-Donnéeën an dësem Browser ginn hei geännert.</p><h3>Präisser</h3>${Object.entries(store.prices).map(([k,v])=>`<div class="drink"><b>${esc(k)}</b><input style="width:85px;padding:8px" type="number" min="0" step="0.5" value="${v}" aria-label="Präis ${esc(k)}" onchange="setPrice('${k}',this.value)"><span>€</span></div>`).join('')}<h3>Service-Nimm</h3><p>${store.names.map(esc).join(' · ')}</p><div class="row"><input id="newName" placeholder="Neie Service-Numm" style="padding:12px;border-radius:9px;border:1px solid #ddd;max-width:220px"><button class="secondary" onclick="addName()">Dobäisetzen</button></div><h3>Testbestellungen</h3><p>${store.orders.length} Bestellungen am Browser</p><button class="danger" onclick="resetDemo()">Bestellëscht zrécksetzen</button></section>`};function render(){document.getElementById('tabs').innerHTML=[['service','👤 Service'],['kichen','👨‍🍳 Kichen'],['bar','🥤 Bar'],['admin','⚙️ Admin']].map(([k,l])=>`<button class="${page===k?'active':''}" onclick="switchPage('${k}')">${l}</button>`).join('');document.getElementById('app').innerHTML=page==='service'?renderService():page==='admin'?renderAdmin():`<h2>${page==='kichen'?'👨‍🍳 Kichen':'🥤 Bar'}</h2>${store.orders.filter(o=>o.items.some(i=>i.target===page)).length?store.orders.filter(o=>o.items.some(i=>i.target===page)).map(o=>orderCard(o,page)).join(''):'<section class="panel">Nach keng Bestellunge fir dëse Beräich.</section>'}`;document.getElementById('bottom').innerHTML=page==='service'?[['bestellung','🏠 Bestellung'],['bestellungen','☷ Bestellunge'],['rechnung','▣ Dëschrechnung']].map(([k,l])=>`<button class="${subpage===k?'active':''}" onclick="switchSub('${k}')">${l}</button>`).join(''):'<button onclick="switchPage(\'service\')">← Zeréck bei Service</button>'}render();
